[project]
name = "robomme"
version = "0.1.0"
description = "Add your description here"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "mani-skill",
    "opencv-python>=4.11.0.86",
    "pebble>=5.2.2",
    "setuptools==80.9.0",
    "torch==2.9.1",
    "torchvision==0.24.1",
]

[project.optional-dependencies]
dev = ["opencv-python", "pytest"]

[tool.uv.sources]
mani-skill = { git = "https://github.com/YinpeiDai/ManiSkill.git", rev = "07be6fbc66350ddca200abfb0a11b692f078f7fd" }
openpi-client = { path = "third_party/mme-vla/packages/openpi-client", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
eval-client = [
    "openpi-client",
    "pillow>=12.1.1",
    "tree>=0.2.4",
]
server = [
    "dm-tree==0.1.8",
    "flask>=3.1.3",
    "msgpack==1.1.2",
    "websockets==15.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/robomme", "src/robomme_hard"]

[tool.pytest.ini_options]
# 新测试结构（1003-code-test-maintenance-todo.md 第二步）：日常门禁 = L0～L3 的非 slow 部分；
# tests/sim 不在 testpaths，只能显式选择并带 --allow-sim-reset 运行。
testpaths = ["tests/static", "tests/contract", "tests/unit", "tests/pipeline"]
addopts = "-p tests._support.resource_policy"
xfail_strict = true
markers = [
    "slow: 起 bash／ffmpeg／websocket／wheel 安装或 1024 全组合等慢用例，不进日常门禁",
    "sim: 真实仿真 reset，只在 tests/sim 中使用",
]
