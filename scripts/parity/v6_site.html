px;height:5px;background:var(--green);border-radius:50%;opacity:0}.task-link[aria-current="page"] .task-dot{opacity:1}.nav-empty{font-size:12px;color:var(--muted);padding:16px 12px;line-height:1.7}.sidebar-footer{border-top:1px solid var(--line);padding:17px 23px 20px;font-size:10px;line-height:1.8;color:var(--muted)}.sidebar-footer strong{display:block;color:var(--ink);font-size:11px;font-weight:550}

    .task-section{border-top:1px solid var(--line);padding-top:29px}.task-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.section-kicker{font-size:10px;letter-spacing:1.1px;color:var(--muted);margin-bottom:10px}.section-kicker span{font-variant-numeric:tabular-nums;color:var(--green);margin-right:8px}.selected-title{margin:0;font-size:27px;font-weight:600;letter-spacing:-.8px;overflow-wrap:anywhere}.selected-id{font-size:12px;color:var(--muted);margin:8px 0 0;letter-spacing:.2px}.selected-note{font-size:13px;line-height:1.95;color:#58665c;margin:17px 0 0;max-width:870px;white-space:pre-line}.tier-count{background:#fff;border:1px solid var(--line);border-radius:100px;padding:8px 12px;font-size:11px;color:var(--muted);white-space:nowrap;margin-top:24px}.tier-path{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:25px 0 26px}.tier-anchor{border:1px solid var(--line);background:transparent;border-radius:100px;display:flex;align-items:center;gap:7px;padding:8px 13px;font-size:11px;text-decoration:none;transition:background .15s}.tier-anchor:hover{background:#e6eddb;border-color:#c8d8b4}.tier-anchor:first-child{background:#fff}.tier-anchor-dot{height:5px;width:5px;border-radius:50%;background:#7a9b65}.tier-arrow{font-size:12px;color:#a3b197;user-select:none}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:23px;align-items:start}.difficulty-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;scroll-margin-top:24px}.card-top{padding:24px 24px 18px;min-height:155px}.card-heading{display:flex;justify-content:space-between;align-items:center;gap:12px}.tier-title{display:flex;align-items:center;gap:11px;margin:0;font-size:17px;font-weight:620;letter-spacing:-.3px}.tier-symbol{height:29px;width:29px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--green);font-variant-numeric:tabular-nums}.difficulty-card[data-tier="hard"] .tier-symbol{background:#f1f3ed;color:#66715f}.tier-code{font-size:10px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.gradient-label{font-size:10px;color:#84917e;margin-top:20px;letter-spacing:.8px}.gradient{font-size:13px;line-height:1.85;margin:6px 0 0;color:#364a3a;white-space:pre-line;overflow-wrap:anywhere}.tier-note{font-size:11px;line-height:1.8;color:var(--muted);margin:8px 0 0;white-space:pre-line}.video-wrap{position:relative;aspect-ratio:4/3;background:#111c19;overflow:hidden}.video-wrap video{width:100%;height:100%;display:block;object-fit:contain;background:#111c19}.video-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#a5b5a7;gap:13px;background:radial-gradient(ellipse at 50% 10%,#2b4034,#14231c 70%)}.video-empty svg{opacity:.55}.video-empty strong{font-size:12px;font-weight:450;letter-spacing:1px}.video-empty p{font-size:10px;margin:0;color:#728977}.video-error{position:absolute;left:12px;right:12px;top:12px;background:rgba(19,32,25,.9);border:1px solid #48614a;color:#e3edda;font-size:11px;line-height:1.7;padding:11px 13px;border-radius:8px;pointer-events:none}.card-bottom{padding:16px 21px 18px;min-height:67px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.sample-caption{font-size:10px;color:var(--muted);letter-spacing:.5px;max-width:45%;line-height:1.6;overflow-wrap:anywhere}.sample-buttons{display:flex;gap:5px;flex-wrap:wrap}.sample-button{font-size:10px;border:1px solid var(--line);background:#fff;border-radius:7px;min-width:32px;padding:7px 8px;line-height:1}.sample-button:hover{background:var(--soft)}.sample-button[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:#fff}.cards-footer{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);margin-top:34px;padding-top:19px;color:var(--muted);font-size:10px;line-height:1.9}.cards-footer strong{font-weight:550;color:#66715f}.status-panel{padding:70px 25px;text-align:center;color:var(--muted);border:1px dashed #d4ddcc;border-radius:var(--radius);margin-top:24px;line-height:1.9;font-size:13px}.status-panel h2{font-size:19px;font-weight:550;color:var(--ink);margin:0 0 12px}.status-panel button{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:11px 18px;font-size:12px;margin-top:12px}.loading-dot{width:24px;height:24px;border:2px solid #dce6d2;border-top-color:var(--green);border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite}.overlay{display:none}.status-inline{font-size:11px;color:var(--muted);line-height:1.7;margin:12px 0;display:none}.status-inline.is-visible{display:block}.task-section[hidden],.status-panel[hidden]{display:none}@keyframes spin{to{transform:rotate(360deg)}}
    .subgoal-flow{margin-top:19px;display:grid;gap:10px}.subgoal-stage{border:1px solid #e6ebdf;background:#fafbf7;border-radius:11px;padding:13px 14px}.subgoal-stage h4{font-size:11px;font-weight:650;letter-spacing:.4px;margin:0 0 9px;color:#3a543f}.subgoal-stage ol{margin:0;padding-left:21px;font-size:12px;line-height:1.85;color:#4d6051}.subgoal-stage li{padding-left:3px;overflow-wrap:anywhere;white-space:pre-line}.subgoal-stage li+li{margin-top:5px}.subgoal-stage li::marker{color:#6a865d;font-variant-numeric:tabular-nums;font-weight:600}.subgoal-stage p{font-size:12px;line-height:1.85;color:#415944;margin:0;white-space:pre-line;overflow-wrap:anywhere}.subgoal-memory{background:#edf3e5;border-color:#dce7cd}.subgoal-flow-note{font-size:11px;line-height:1.8;color:var(--muted);margin:0 2px;white-space:pre-line;overflow-wrap:anywhere}
    .known-issue{margin-top:21px;padding:20px 23px;border:1px solid #ebcca4;border-left:4px solid #c48642;border-radius:13px;background:#fff5e8;color:#684928}.known-issue h3{font-size:15px;font-weight:650;line-height:1.65;margin:0 0 11px;color:#87531f;overflow-wrap:anywhere}.known-issue ol{margin:0;padding-left:22px;font-size:12px;line-height:1.9}.known-issue li{padding-left:4px;white-space:pre-line;overflow-wrap:anywhere}.known-issue li+li{margin-top:7px}.known-issue li::marker{font-weight:650;color:#a96c2d}.known-issue-note{font-size:11px;line-height:1.85;margin:13px 0 0;padding-top:12px;border-top:1px solid #ecd9bf;color:#856440;white-space:pre-line;overflow-wrap:anywhere}.known-issue[hidden]{display:none}
    @media(min-width:1550px){.main{padding-left:66px;padding-right:66px}.cards{gap:28px}.card-top{padding:27px 28px 21px;min-height:165px}}
    @media(max-width:1120px){:root{--sidebar:238px}.main{padding-left:28px;padding-right:28px}.brand{padding-left:21px}.cards{gap:17px}.card-top{padding:20px 18px 16px}.card-bottom{padding-left:16px;padding-right:16px}.intro-art{width:115px;height:85px}.selected-title{font-size:24px}.tier-title{font-size:15px}.intro{gap:20px}}
    @media(max-width:820px){:root{--sidebar:270px}.sidebar{transform:translateX(-100%);transition:transform .2s}.sidebar.is-open{transform:none;box-shadow:12px 0 45px #172a2620}.overlay.is-open{display:block;position:fixed;inset:0;background:#18251f66;border:0;z-index:15}.main{margin-left:0;padding:0 24px 28px;max-width:none}.mobile-menu{display:flex}.topbar{min-height:74px}.breadcrumb{display:none}.intro{padding-top:30px}.intro h1{font-size:30px}.intro-art{width:116px}.brand{padding-top:27px}.cards{gap:18px}.task-heading{gap:14px}}
    @media(max-width:560px){.main{padding-left:17px;padding-right:17px}.intro{padding:29px 1px 25px;gap:12px}.intro h1{font-size:25px;letter-spacing:-.6px}.intro p{font-size:11px}.intro-art{width:75px;height:76px;gap:4px;padding:8px 0}.intro-art span{border-radius:4px 4px 2px 2px}.eyebrow{font-size:9px;letter-spacing:1.6px}.cards{grid-template-columns:1fr;gap:20px}.task-section{padding-top:23px}.selected-title{font-size:25px}.selected-note{font-size:12px;margin-top:15px}.tier-count{font-size:10px;padding:7px 10px}.tier-path{padding:21px 0;gap:5px}.tier-anchor{font-size:10px;padding:7px 10px}.tier-arrow{font-size:10px}.card-top{min-height:0;padding:22px}.gradient{font-size:13px}.gradient-label{margin-top:16px}.tier-title{font-size:17px}.card-bottom{padding:16px 20px}.cards-footer{font-size:9px;gap:10px}.cards-footer div:last-child{text-align:right}}
    /* 跳转入口只在键盘聚焦时显示，避免鼠标操作后留在页面上。 */
    .skip-link{top:-100px;transform:none;visibility:hidden}.skip-link:focus{transform:none}.skip-link:focus-visible{top:12px;visibility:visible}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

<body>
  <a class="skip-link" href="#content">跳转到任务介绍</a>
  <aside class="sidebar" id="sidebar" aria-label="任务选择">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg width="25" height="25" viewBox="0 0 25 25" fill="none"><path d="M5 17V8l7.5-4L20 8v9l-7.5 4L5 17Z" stroke="currentColor" stroke-width="1.4"/><path d="m5 8 7.5 4L20 8M12.5 12v9M8.8 6l7.5 4" stroke="currentColor" stroke-width="1.4"/></svg></div>
      <div><div class="brand-name">RoboMME</div><div class="brand-caption">任务难度图谱</div></div>
    </div>
    <div class="sidebar-heading"><span>探索任务</span><span class="task-count" id="task-count">—</span></div>
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <label class="sr-only" for="task-search">按中文名或任务标识搜索</label><input class="search" id="task-search" type="search" placeholder="查找任务…" autocomplete="off">
    </div>
    <nav class="task-nav" id="task-nav" aria-label="全部任务"></nav>
    <div class="sidebar-footer"><strong>从原版任务，到更多挑战</strong>逐个认识任务，逐档观看示例。</div>
  </aside>
  <button class="overlay" id="overlay" aria-label="关闭任务导航" tabindex="-1"></button>
  <main class="main" id="content" tabindex="-1">
    <header class="topbar">
      <div class="breadcrumb"><span>RoboMME</span><span class="slash">/</span><strong>任务与难度</strong></div>
      <button class="mobile-menu" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false"><svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>切换任务</button>
      <div class="top-actions"><button class="refresh" id="refresh" type="button"><svg width="13" height="13" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M16.5 9a6.5 6.5 0 1 0-1 4.5M16.5 4v5H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>更新内容</span></button></div>
    </header>
    <section class="intro" aria-labelledby="page-title">
      <div><div class="eyebrow">观察 · 记忆 · 行动</div><h1 id="page-title">同一个任务，循序增加挑战。</h1><p>了解每个任务如何变难，再通过独立的视频示例，观察不同难度下的实际表现。</p></div>
      <div class="intro-art" aria-hidden="true"><span style="--height:25%"></span><span style="--height:43%"></span><span style="--height:61%"></span><span style="--height:80%"></span><span style="--height:100%"></span></div>
    </section>
    <div id="inline-status" class="status-inline" role="status"></div>
    <div class="status-panel" id="status-panel" role="status"><div class="loading-dot" aria-hidden="true"></div>正在载入任务介绍…</div>
    <section class="task-section" id="task-section" aria-labelledby="selected-title" hidden>
      <div class="task-heading"><div><div class="section-kicker"><span id="selected-number"></span>任务介绍</div><h2 class="selected-title" id="selected-title"></h2><p class="selected-id" id="selected-id"></p></div><div class="tier-count" id="tier-count"></div></div>
      <p class="selected-note" id="selected-note"></p>
      <aside class="known-issue" id="known-issue" aria-label="已知问题说明" hidden></aside>
      <nav class="tier-path" id="tier-path" aria-label="当前任务的难度导航"></nav>
      <div class="cards" id="cards"></div>
      <footer class="cards-footer"><div><strong>每一档，都有自己的挑战。</strong><br>选择卡片下方的样例，即可切换视频。</div><div>原版 hard 作为对照<br>新增难度按任务分别展示</div></footer>
    </section>
    <p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
  </main>
  <script>
    'use strict';
    const el = id => document.getElementById(id);
    const state = { tasks: [], selected: null, loading: false };
    const tierOrder = ['hard', 'xhard1', 'xhard2', 'xhard3', 'xhard4'];
    const fallbackLabels = { hard: '原版难度', xhard1: '扩展难度一', xhard2: '扩展难度二', xhard3: '扩展难度三', xhard4: '扩展难度四' };
    const tierLabel = tier => tier.label && tier.label !== tier.id ? tier.label : fallbackLabels[tier.id] || tier.id;

    function node(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function readable(value) {
      if (typeof value === 'string') return value.trim();
      if (Array.isArray(value)) return value.map(readable).filter(Boolean).join('\n');
      if (value && typeof value === 'object') return Object.entries(value).map(([key, item]) => `${key}：${readable(item)}`).join('\n');
      return value === undefined || value === null ? '' : String(value);
    }

    function mediaUrl(value) {
      if (!value) return '';
      try {
        const url = new URL(value, window.location.origin);
        return url.origin === window.location.origin && url.pathname.startsWith('/media/') ? url.href : '';
      } catch { return ''; }
    }

    function closeMenu(restoreFocus = false) {
      el('sidebar').classList.remove('is-open');
      el('overlay').classList.remove('is-open');
      el('menu-toggle').setAttribute('aria-expanded', 'false');
      if (restoreFocus) el('menu-toggle').focus();
    }

    function renderNavigation() {
      const query = el('task-search').value.trim().toLocaleLowerCase();
      const fragment = document.createDocumentFragment();
      let matches = 0;
      state.tasks.forEach((task, index) => {
        if (query && !`${task.name} ${task.id}`.toLocaleLowerCase().includes(query)) return;
        matches++;
        const button = node('button', 'task-link');
        button.type = 'button';
        if (task.id === state.selected) button.setAttribute('aria-current', 'page');
        button.append(node('span', 'task-index', String(index + 1).padStart(2, '0')));
        const copy = node('span', 'task-copy');
        copy.append(node('span', 'task-name', task.name || task.id));
        if (task.name && task.name !== task.id) copy.append(node('span', 'task-id', task.id));
        button.append(copy, node('span', 'task-dot'));
        button.addEventListener('click', () => {
          const changed = state.selected !== task.id;
          selectTask(task.id);
          closeMenu();
          if (changed) window.scrollTo({ top: 0, behavior: 'instant' });
        });
        fragment.append(button);
      });
      if (!matches) fragment.append(node('p', 'nav-empty', '没有找到匹配的任务，试试其他名称。'));
      el('task-nav').replaceChildren(fragment);
      el('task-count').textContent = `${state.tasks.length} 个任务`;
    }

    function buildSubgoalFlow(flow) {
      if (!flow || typeof flow !== 'object' || Array.isArray(flow)) return null;
      const container = node('div', 'subgoal-flow');
      function addSteps(label, values) {
        if (!Array.isArray(values)) return;
        const steps = values.map(readable).filter(Boolean);
        if (!steps.length) return;
        const section = node('section', 'subgoal-stage');
        const list = node('ol');
        steps.forEach(step => list.append(node('li', '', step)));
        section.append(node('h4', '', label), list);
        container.append(section);
      }
      addSteps('演示阶段', flow.demo_steps);
      if (readable(flow.remember)) {
        const memory = node('section', 'subgoal-stage subgoal-memory');
        memory.append(node('h4', '', '需要记住'), node('p', '', readable(flow.remember)));
        container.append(memory);
      }
      addSteps('执行阶段', flow.execution_steps);
      if (readable(flow.note)) container.append(node('p', 'subgoal-flow-note', readable(flow.note)));
      return container.childElementCount ? container : null;
    }

    function buildCard(task, tier, index) {
      const card = node('article', 'difficulty-card');
      card.id = `difficulty-${index}`;
      card.dataset.tier = tier.id;
      const top = node('div', 'card-top');
      const heading = node('div', 'card-heading');
      const title = node('h3', 'tier-title');
      const symbol = tier.id === 'hard' ? '原' : tier.id.replace('xhard', '');
      title.append(node('span', 'tier-symbol', symbol), node('span', '', tierLabel(tier)));
      heading.append(title, node('span', 'tier-code', tier.id));
      top.append(heading, node('div', 'gradient-label', tier.id === 'hard' ? '原版任务设定' : '这一档的挑战'));
      top.append(node('p', 'gradient', readable(tier.gradient) || '难度介绍即将补充。'));
      if (readable(tier.note)) top.append(node('p', 'tier-note', readable(tier.note)));
      const flow = buildSubgoalFlow(tier.subgoal_flow);
      if (flow) top.append(flow);
      const wrap = node('div', 'video-wrap');
      const bottom = node('div', 'card-bottom');
      const videos = (Array.isArray(tier.videos) ? tier.videos : []).filter(item => item && mediaUrl(item.url));
      const caption = node('div', 'sample-caption');
      if (!videos.length) {
        const empty = node('div', 'video-empty');
        empty.innerHTML = '<svg width="34" height="34" viewBox="0 0 36 36" fill="none" aria-hidden="true"><rect x="5" y="7" width="26" height="22" rx="5" stroke="currentColor" stroke-width="1.2"/><path d="m15 13 8 5-8 5V13Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';
        empty.append(node('strong', '', '视频准备中'), node('p', '', '可以先了解这一档的任务设定'));
        wrap.append(empty);
        caption.textContent = '暂无可观看的样例';
        bottom.append(caption);
      } else {
        const video = node('video');
        video.controls = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.setAttribute('aria-label', `${task.name || task.id} · ${tierLabel(tier)} 视频示例`);
        const error = node('div', 'video-error', '这段视频暂时无法播放，请切换样例或稍后更新内容。');
        error.hidden = true;
        error.setAttribute('role', 'status');
        video.addEventListener('error', () => { error.hidden = false; });
        video.addEventListener('loadeddata', () => { error.hidden = true; });
        video.addEventListener('play', () => {
          document.querySelectorAll('video').forEach(other => { if (other !== video) other.pause(); });
        });
        wrap.append(video, error);
        const buttons = node('div', 'sample-buttons');
        buttons.setAttribute('role', 'group');
        buttons.setAttribute('aria-label', '选择视频样例');
        function choose(sampleIndex) {
          const sample = videos[sampleIndex];
          video.pause();
          error.hidden = true;
          const poster = sample.id
            ? new URL(`/poster/${encodeURIComponent(String(sample.id))}`, window.location.origin).href
            : mediaUrl(sample.poster);
          if (poster) video.poster = poster;
          else video.removeAttribute('poster');
          video.src = mediaUrl(sample.url);
          video.load();
          caption.textContent = sample.label || `样例 ${sampleIndex + 1} / ${videos.length}`;
          Array.from(buttons.children).forEach((button, buttonIndex) => {
            button.setAttribute('aria-pressed', String(buttonIndex === sampleIndex));
          });
        }
        videos.forEach((sample, sampleIndex) => {
          const button = node('button', 'sample-button', String(sampleIndex + 1).padStart(2, '0'));
          button.type = 'button';
          button.title = sample.label || `样例 ${sampleIndex + 1}`;
          button.setAttribute('aria-label', `观看${sample.label || `样例 ${sampleIndex + 1}`}`);
          button.addEventListener('click', () => choose(sampleIndex));
          buttons.append(button);
        });
        bottom.append(caption, buttons);
        choose(0);
      }
      card.append(top, wrap, bottom);
      return card;
    }

    function selectTask(id) {
      const task = state.tasks.find(item => item.id === id);
      if (!task) return;
      document.querySelectorAll('video').forEach(video => video.pause());
      state.selected = id;
      const index = state.tasks.indexOf(task);
      el('selected-number').textContent = String(index + 1).padStart(2, '0');
      el('selected-title').textContent = task.name || task.id;
      el('selected-id').textContent = task.name && task.name !== task.id ? task.id : '';
      el('selected-id').hidden = !el('selected-id').textContent;
      el('selected-note').textContent = readable(task.note) || '从原版 hard 出发，逐档查看任务设定与视频示例。';
      const issueBox = el('known-issue');
      issueBox.replaceChildren();
      const issue = task.known_issue;
      if (issue && typeof issue === 'object' && !Array.isArray(issue)) {
        if (readable(issue.title)) issueBox.append(node('h3', '', readable(issue.title)));
        if (Array.isArray(issue.steps)) {
          const steps = issue.steps.map(readable).filter(Boolean);
          if (steps.length) {
            const list = node('ol');
            steps.forEach(step => list.append(node('li', '', step)));
            issueBox.append(list);
          }
        }
        if (readable(issue.note)) issueBox.append(node('p', 'known-issue-note', readable(issue.note)));
      }
      issueBox.hidden = !issueBox.childElementCount;
      const tiers = (Array.isArray(task.tiers) ? task.tiers : [])
        .filter(tier => tier && tierOrder.includes(tier.id))
        .sort((a, b) => tierOrder.indexOf(a.id) - tierOrder.indexOf(b.id));
      el('tier-count').textContent = `${tiers.length} 个难度`;
      const cards = document.createDocumentFragment();
      const links = document.createDocumentFragment();
      tiers.forEach((tier, tierIndex) => {
        cards.append(buildCard(task, tier, tierIndex));
        if (tierIndex) {
          const arrow = node('span', 'tier-arrow', '→');
          arrow.setAttribute('aria-hidden', 'true');
          links.append(arrow);
        }
        const link = node('a', 'tier-anchor');
        link.href = `#difficulty-${tierIndex}`;
        link.append(node('span', 'tier-anchor-dot'), node('span', '', tierLabel(tier)));
        link.addEventListener('click', event => {
          event.preventDefault();
          el(`difficulty-${tierIndex}`).scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
        });
        links.append(link);
      });
      if (!tiers.length) cards.append(node('div', 'status-panel', '这个任务的难度介绍正在准备中。'));
      el('cards').replaceChildren(cards);
      el('tier-path').replaceChildren(links);
      el('task-section').hidden = false;
      el('status-panel').hidden = true;
      renderNavigation();
      document.title = `${task.name || task.id} · RoboMME 任务难度图谱`;
      history.replaceState(null, '', `#task=${encodeURIComponent(task.id)}`);
      el('announcement').textContent = `已切换到${task.name || task.id}，共 ${tiers.length} 个难度。`;
    }

    async function loadCatalog() {
      if (state.loading) return;
      state.loading = true;
      el('refresh').disabled = true;
      el('refresh').querySelector('span').textContent = '正在更新';
      el('inline-status').classList.remove('is-visible');
      try {
        const response = await fetch('/api/catalog', { cache: 'no-store', headers: { Accept: 'application/json' } });
        if (!response.ok) throw new Error('任务介绍暂不可用');
        const catalog = await response.json();
        if (!Array.isArray(catalog.tasks)) throw new Error('任务介绍尚未准备好');
        const seen = new Set();
        const tasks = catalog.tasks.filter(task => {
          if (!task || typeof task.id !== 'string' || !task.id || seen.has(task.id)) return false;
          seen.add(task.id);
          return true;
        });
        if (!tasks.length) throw new Error('任务介绍尚未准备好');
        state.tasks = tasks;
        const requested = new URLSearchParams(window.location.hash.slice(1)).get('task');
        const target = state.selected || requested;
        selectTask(tasks.some(task => task.id === target) ? target : tasks[0].id);
      } catch (error) {
        if (state.tasks.length) {
          el('inline-status').textContent = '暂时无法更新，仍可查看已经载入的任务。稍后再试。';
          el('inline-status').classList.add('is-visible');
        } else {
          const panel = el('status-panel');
          panel.replaceChildren(node('h2', '', '任务介绍暂时无法载入'), node('p', '', '请稍后重试，或检查当前网络连接。'));
          const retry = node('button', '', '重新载入');
          retry.type = 'button';
          retry.addEventListener('click', loadCatalog);
          panel.append(retry);
          panel.hidden = false;
        }
      } finally {
        state.loading = false;
        el('refresh').disabled = false;
        el('refresh').querySelector('span').textContent = '更新内容';
      }
    }

    el('task-search').addEventListener('input', renderNavigation);
    el('refresh').addEventListener('click', loadCatalog);
    el('menu-toggle').addEventListener('click', () => {
      const open = !el('sidebar').classList.contains('is-open');
      el('sidebar').classList.toggle('is-open', open);
      el('overlay').classList.toggle('is-open', open);
      el('menu-toggle').setAttribute('aria-expanded', String(open));
      if (open) el('task-search').focus();
    });
    el('overlay').addEventListener('click', () => closeMenu(true));
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenu(true); });
    window.addEventListener('hashchange', () => {
      const requested = new URLSearchParams(window.location.hash.slice(1)).get('task');
      if (requested && requested !== state.selected && state.tasks.some(task => task.id === requested)) {
        selectTask(requested);
        closeMenu();
      }
    });
    loadCatalog();
  </script>
</body>
</html>
