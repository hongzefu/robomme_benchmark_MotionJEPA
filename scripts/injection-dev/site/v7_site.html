<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>RoboMME v7 · 逐局对照</title>
  <style>
    :root{--paper:#f6f7f2;--card:#fff;--ink:#172a26;--muted:#6e7a72;--line:#e1e6dc;--green:#246847;--soft:#eaf0e5;--accent:#d4e4a4;--sidebar:250px;
      --s-success:#2e8b57;--s-fail:#c2453a;--s-timeout:#9aa0a6;--s-error:#222;--s-genfail:#7a5ab8}
    *{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;background:var(--paper);color:var(--ink);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #75a97b;outline-offset:3px}
    .sidebar{width:var(--sidebar);position:fixed;inset:0 auto 0 0;background:#fbfcf8;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
    .brand{padding:26px 22px 18px}.brand-name{font-size:18px;font-weight:750;letter-spacing:-.6px}.brand-caption{font-size:11px;margin-top:4px;color:var(--muted);letter-spacing:1px}
    .search{margin:0 16px 10px;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:12px;background:transparent}
    .task-nav{overflow:auto;padding:0 10px 16px;flex:1}.task-link{width:100%;display:flex;gap:10px;align-items:center;padding:9px 11px;border:1px solid transparent;background:transparent;text-align:left;border-radius:10px;margin:2px 0}
    .task-link:hover{background:#eff3e9}.task-link[aria-current="page"]{background:var(--soft);border-color:#dce6cf}.task-index{font-size:11px;color:#8c988b;width:18px;font-variant-numeric:tabular-nums}.task-name{font-size:12px;font-weight:650;display:block}.task-id{font-size:10px;color:var(--muted);display:block;margin-top:2px}
    .main{margin-left:var(--sidebar);padding:22px 40px 40px;max-width:1800px}
    .topbar{display:flex;align-items:center;gap:12px;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.topbar h1{font-size:22px;margin:0;font-weight:620;letter-spacing:-.5px}.topbar p{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.7}
    .mobile-menu{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:12px;white-space:nowrap;flex-shrink:0}
    h2.task-title{font-size:24px;margin:22px 0 4px;font-weight:620}.task-sub{font-size:12px;color:var(--muted)}
    .matrix{margin-top:16px;border-collapse:collapse;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:block;max-width:100%;overflow-x:auto}
    .matrix th,.matrix td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}.matrix th{font-weight:600;color:#3a543f;background:#fafbf7}.matrix td:first-child,.matrix th:first-child{text-align:left}
    .matrix .tier-col{cursor:pointer}.matrix .tier-col.is-current{background:var(--soft)}.matrix .na{color:#b5beb0}
    .tier-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}.tier-tab{border:1px solid var(--line);background:#fff;border-radius:100px;padding:7px 14px;font-size:12px}.tier-tab[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}.tier-tab:disabled{opacity:.4;cursor:not-allowed}
    .filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}.filters span{font-size:11px;color:var(--muted);margin-right:4px}.filter{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 10px;font-size:11px}.filter[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 18px}.chip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 7px 5px;min-width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-variant-numeric:tabular-nums}
    .chip[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 2px var(--green) inset}.chip.is-flip{background:#fff4e3;border-color:#e3b875}.chip[hidden]{display:none}.dots{display:flex;gap:3px}.dot{width:9px;height:9px;border-radius:50%;background:#ddd}
    .s-success{background:var(--s-success)}.s-fail{background:var(--s-fail)}.s-timeout{background:var(--s-timeout)}.s-error{background:var(--s-error)}.s-generation_failed{background:var(--s-genfail)}
    .legend{font-size:11px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
    .episode-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}.episode-head h3{margin:0;font-size:17px;font-weight:620}.episode-meta{font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
    .sync{background:var(--ink);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-size:12px}
    .entry{margin-top:16px}.entry-label{font-size:12px;font-weight:650;color:#3a543f;margin-bottom:8px}.entry-label small{font-weight:400;color:var(--muted);margin-left:6px}
    .cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.col{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
    .col-head{padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.col-title{font-size:13px;font-weight:650}.badge{font-size:11px;color:#fff;border-radius:6px;padding:2px 8px;white-space:nowrap}
    .col-meta{font-size:11px;color:var(--muted);padding:0 12px 8px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
    .col video{width:100%;display:block;background:#111c19;aspect-ratio:16/9;object-fit:contain}.empty{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;background:#1b2621;color:#c9d6cb;font-size:12px;line-height:1.7}
    .attempts{display:flex;gap:5px;padding:8px 12px}.attempt{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;font-size:11px}.attempt[aria-pressed="true"]{background:var(--ink);color:#fff}
    .notes{margin-top:26px;font-size:11.5px;line-height:1.85;color:#58665c;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}.notes p{margin:4px 0}
    .rerun-panel{margin:16px 0 4px;background:#fff;border:1px solid #e3b875;border-radius:12px;font-size:12.5px;line-height:1.8}
    .rerun-panel summary{cursor:pointer;padding:12px 16px;font-weight:650;color:#6b4a12;background:#fff4e3;border-radius:12px}
    .rerun-panel[open] summary{border-radius:12px 12px 0 0;border-bottom:1px solid #f0d9ae}
    .rerun-body{padding:10px 16px 14px}.rerun-body p{margin:6px 0}.rerun-body b{color:#172a26}
    .rerun-body code{font-size:11px;background:#f3f5ef;padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
    .rr-table{border-collapse:collapse;font-size:11.5px;margin:8px 0;display:block;max-width:100%;overflow-x:auto}
    .rr-table th,.rr-table td{padding:5px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;font-variant-numeric:tabular-nums}
    .rr-table th{background:#fafbf7;font-weight:600;color:#3a543f}.rr-table tr.is-here td{background:#fff4e3}
    .rr-table a{color:var(--green);cursor:pointer;text-decoration:underline}
    .rr-same{background:#e4efd9;border-radius:4px;padding:0 4px}
    .st-success{color:var(--s-success);font-weight:650}.st-fail{color:var(--s-fail);font-weight:650}.st-timeout{color:#6f757a;font-weight:650}
    .chip.is-rerun{outline:2px dashed #b9812a;outline-offset:1px}
    .verdict{padding:12px 14px;font-size:12px;line-height:1.85}.verdict ul{margin:4px 0;padding-left:18px}.verdict b{color:#172a26}
    .sg-panel{margin:16px 0 4px;background:#fff;border:1px solid var(--line);border-radius:12px;font-size:12px;line-height:1.75}
    .sg-panel summary{cursor:pointer;padding:12px 16px;font-weight:650;color:#3a543f;background:#fafbf7;border-radius:12px}
    .sg-panel[open] summary{border-radius:12px 12px 0 0;border-bottom:1px solid var(--line)}
    .sg-body{padding:10px 16px 14px}.sg-body p{margin:6px 0}.sg-explain{background:#f3f7ee;border-radius:8px;padding:8px 12px}
    .sg-table{border-collapse:collapse;font-size:11.5px;margin:8px 0;display:block;max-width:100%;overflow-x:auto}
    .sg-table th,.sg-table td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
    .sg-table th{background:#fafbf7;font-weight:600;color:#3a543f}.sg-table td.txt{white-space:normal;min-width:220px;max-width:460px}
    .sg-table .is-cur{background:var(--soft)}.sg-table td.v-diff{background:#fde5e1;color:#9c2f25;font-weight:650}.sg-table td.v-new{background:#fff1d6;color:#8a5a0f;font-weight:650}.v-base{color:#3a543f;font-weight:650}
    .sg-ep{margin-top:16px}
    .status-panel{padding:60px 20px;text-align:center;color:var(--muted)}
    @media(max-width:1100px){.cols{grid-template-columns:1fr 1fr}}
    @media(max-width:820px){.sidebar{transform:translateX(-100%);transition:transform .2s}.sidebar.is-open{transform:none;box-shadow:12px 0 45px #172a2620}.main{margin-left:0;padding:16px 16px 28px}.mobile-menu{display:inline-block}.cols{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar" aria-label="任务选择">
    <div class="brand"><div class="brand-name">RoboMME v7</div><div class="brand-caption">生成 vs SimpleMemVLA vs MME-VLA</div></div>
    <input class="search" id="task-search" type="search" placeholder="查找任务…" autocomplete="off" aria-label="搜索任务">
    <nav class="task-nav" id="task-nav" aria-label="全部任务"></nav>
  </aside>
  <main class="main" id="content">
    <header class="topbar">
      <div><h1>v7 逐局对照</h1><p>每一局并排展示生成演示与两个策略的评估录像。xhard0 分新入口（robomme_hard）与旧入口（官方 robomme）两行。</p></div>
      <button class="mobile-menu" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false">切换任务</button>
    </header>
    <div class="status-panel" id="status-panel" role="status">正在载入…</div>
    <section id="task-section" hidden>
      <h2 class="task-title" id="task-title"></h2><div class="task-sub" id="task-sub"></div>
      <table class="matrix" id="matrix" aria-label="各档成功率"></table>
      <div class="tier-tabs" id="tier-tabs" role="group" aria-label="档位"></div>
      <div class="filters" id="filters" role="group" aria-label="筛选"></div>
      <div class="legend" id="legend"></div>
      <details class="sg-panel" id="sg-panel" hidden></details>
      <details class="rerun-panel" id="rerun-panel" open hidden></details>
      <div class="chips" id="chips" role="group" aria-label="局号"></div>
      <section id="episode"></section>
      <div class="notes" id="notes"></div>
    </section>
  </main>
  <script>
    'use strict';
    const el = id => document.getElementById(id);
    const S = { sg: null, cat: null, task: null, tier: null, ep: null, filter: 'all' };
    const STATUS_ZH = { success: '成功', fail: '失败', timeout: '超时', error: '错误', generation_failed: '生成失败' };
    const TIER_ZH = { xhard0: 'xhard0（原版 hard）', xhard1: 'xhard1', xhard2: 'xhard2', xhard3: 'xhard3', xhard4: 'xhard4' };
    const ENTRY_ZH = { new: '新入口 · robomme_hard', old: '旧入口 · 官方 robomme' };
    const FILTERS = [['all', '全部'], ['both', '两者都成'], ['split', '分歧'], ['none', '两者都未成'], ['flip', '新旧入口翻转'], ['rerun', '同卡重跑的局']];

    function node(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
    const policies = () => S.cat.policies;
    const taskObj = () => S.cat.tasks.find(t => t.id === S.task);
    const cell = () => taskObj().tiers[S.tier];
    const ok = st => st === 'success';

    function readHash() {
      const h = new URLSearchParams(location.hash.slice(1));
      return { task: h.get('task'), tier: h.get('tier'), ep: Number(h.get('ep')) || null };
    }
    function writeHash() {
      const h = `#task=${S.task}&tier=${S.tier}&ep=${S.ep}`;
      if (location.hash !== h) history.replaceState(null, '', h);
    }

    function rateText(counts, n) {
      const s = counts.success || 0;
      return `${s}/${n}（${Math.round(100 * s / n)}%）`;
    }

    function renderNav() {
      const nav = el('task-nav'); nav.textContent = '';
      const q = el('task-search').value.trim().toLowerCase();
      S.cat.tasks.forEach((t, i) => {
        if (q && !(t.id.toLowerCase().includes(q) || t.name.includes(q))) return;
        const b = node('button', 'task-link'); b.type = 'button';
        if (t.id === S.task) b.setAttribute('aria-current', 'page');
        b.append(node('span', 'task-index', String(i + 1).padStart(2, '0')));
        const c = node('span'); c.append(node('span', 'task-name', t.name), node('span', 'task-id', t.id)); b.append(c);
        b.addEventListener('click', () => { el('sidebar').classList.remove('is-open'); select(t.id); });
        nav.append(b);
      });
    }

    function renderMatrix() {
      const t = taskObj(), m = el('matrix'); m.textContent = '';
      const head = node('tr'); head.append(node('th', '', '成功率'));
      S.cat.tiers.forEach(tier => {
        const th = node('th', 'tier-col' + (tier === S.tier ? ' is-current' : ''), tier);
        if (t.tiers[tier]) th.addEventListener('click', () => select(S.task, tier)); else th.classList.add('na');
        head.append(th);
      });
      m.append(head);
      const rows = [];
      policies().forEach(p => rows.push([`${p.label}`, 'new', p.id]));
      policies().forEach(p => rows.push([`${p.label}（xhard0 旧入口）`, 'old', p.id]));
      rows.forEach(([label, entry, pid]) => {
        const tr = node('tr'); tr.append(node('td', '', label));
        S.cat.tiers.forEach(tier => {
          const c = t.tiers[tier];
          const r = c && c.rates[entry] && c.rates[entry][pid];
          const td = node('td', 'tier-col' + (tier === S.tier ? ' is-current' : ''), r ? rateText(r, c.episodes.length) : '—');
          if (!r) td.classList.add('na'); else td.addEventListener('click', () => select(S.task, tier));
          tr.append(td);
        });
        m.append(tr);
      });
    }

    function renderTabs() {
      const box = el('tier-tabs'); box.textContent = '';
      S.cat.tiers.forEach(tier => {
        const b = node('button', 'tier-tab', TIER_ZH[tier]); b.type = 'button';
        b.setAttribute('aria-pressed', String(tier === S.tier));
        if (!taskObj().tiers[tier]) { b.disabled = true; b.title = '该任务只有 xhard0 与 xhard4'; }
        else b.addEventListener('click', () => select(S.task, tier));
        box.append(b);
      });
    }

    function epMatches(ep) {
      const [a, b] = policies().map(p => ok((ep.eval.new[p.id] || {}).status));
      switch (S.filter) {
        case 'both': return a && b;
        case 'split': return a !== b;
        case 'none': return !a && !b;
        case 'flip': return !!ep.flip && Object.values(ep.flip).some(Boolean);
        case 'rerun': return !!ep.rerun;
        default: return true;
      }
    }

    function renderFilters() {
      const box = el('filters'); box.textContent = '';
      box.append(node('span', '', '按新入口两策略成败筛选：'));
      FILTERS.forEach(([id, label]) => {
        if ((id === 'flip' || id === 'rerun') && S.tier !== 'xhard0') return;
        const n = cell().episodes.filter(ep => { const f = S.filter; S.filter = id; const r = epMatches(ep); S.filter = f; return r; }).length;
        const b = node('button', 'filter', `${label} ${n}`); b.type = 'button'; b.dataset.filter = id;
        b.setAttribute('aria-pressed', String(S.filter === id));
        b.addEventListener('click', () => { S.filter = id; renderFilters(); renderChips(); });
        box.append(b);
      });
      const lg = el('legend'); lg.textContent = '';
      lg.append(node('span', '', '局号下两个点：左 SimpleMemVLA、右 MME-VLA（新入口）。'));
      Object.entries(STATUS_ZH).filter(([k]) => k !== 'generation_failed').forEach(([k, v]) => {
        const s = node('span'); const i = node('i', 's-' + k); s.append(i, document.createTextNode(v)); lg.append(s);
      });
      if (S.tier === 'xhard0') lg.append(node('span', '', '橙底 = 新旧入口成败翻转；虚线框 = 已做同卡重跑（MME）'));
    }

    function renderChips() {
      const box = el('chips'); box.textContent = '';
      cell().episodes.forEach(ep => {
        const b = node('button', 'chip'); b.type = 'button'; b.dataset.ep = ep.idx;
        b.setAttribute('aria-pressed', String(ep.idx === S.ep));
        b.setAttribute('aria-label', `第 ${ep.idx} 局`);
        if (ep.flip && Object.values(ep.flip).some(Boolean)) b.classList.add('is-flip');
        if (ep.rerun) b.classList.add('is-rerun');
        b.hidden = !epMatches(ep);
        b.append(node('span', '', String(ep.idx).padStart(2, '0')));
        const dots = node('span', 'dots');
        policies().forEach(p => { const st = (ep.eval.new[p.id] || {}).status; const d = node('span', 'dot s-' + st); d.title = `${p.label}：${STATUS_ZH[st] || '—'}`; dots.append(d); });
        b.append(dots);
        b.addEventListener('click', () => { S.ep = ep.idx; writeHash(); renderChips(); renderRerunPanel(); renderEpisode(); });
        box.append(b);
      });
    }

    function videoEl(id) {
      const v = document.createElement('video');
      v.controls = true; v.preload = 'metadata'; v.muted = true; v.playsInline = true; v.src = `/media/${id}#t=0.1`;  // 媒体片段：未播放时先显示首帧，不是黑屏
      return v;
    }

    function genColumn(g, tier) {
      const col = node('div', 'col'); const head = node('div', 'col-head');
      head.append(node('span', 'col-title', '生成演示'));
      if (g && g.status === 'generation_failed') head.append(Object.assign(node('span', 'badge s-generation_failed', '生成失败')));
      col.append(head);
      if (!g) { col.append(node('div', 'empty', '无生成记录')); return col; }
      const meta = [`帧数 ${g.frames}`];
      if (g.demo_frames) meta.push(`演示段 ${g.demo_frames}`);
      if (g.h5_sha12) meta.push(`h5 sha ${g.h5_sha12}`);
      col.append(node('div', 'col-meta', meta.join(' · ')));
      if (g.media) col.append(videoEl(g.media));
      else col.append(node('div', 'empty', '官方原版在该 seed 上生成失败（DatasetGenerationError），两个入口相同，没有生成视频。'));
      return col;
    }

    function evalColumn(p, r) {
      const col = node('div', 'col'); const head = node('div', 'col-head');
      head.append(node('span', 'col-title', p.label));
      if (r) head.append(node('span', 'badge s-' + r.status, STATUS_ZH[r.status] || r.status));
      col.append(head);
      if (!r) { col.append(node('div', 'empty', '无评估记录')); return col; }
      const meta = [];
      if (r.steps != null) meta.push(`步数 ${r.steps}${r.max_steps ? ' / 上限 ' + r.max_steps : ''}`);
      col.append(node('div', 'col-meta', meta.join(' · ') || '—'));
      if (r.media) col.append(videoEl(r.media));
      else if (r.attempts && r.attempts.length) {
        const holder = node('div');
        const tabs = node('div', 'attempts');
        r.attempts.forEach((id, i) => {
          const b = node('button', 'attempt', `第 ${i + 1} 遍`); b.type = 'button';
          b.setAttribute('aria-pressed', String(i === 0));
          b.addEventListener('click', () => { tabs.querySelectorAll('.attempt').forEach(x => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); holder.replaceChildren(videoEl(id)); });
          tabs.append(b);
        });
        holder.append(videoEl(r.attempts[0]));
        col.append(tabs, holder);
      } else col.append(node('div', 'empty', '无视频'));
      return col;
    }

    function renderEpisode() {
      const box = el('episode'); box.textContent = '';
      const ep = cell().episodes.find(e => e.idx === S.ep); if (!ep) return;
      const head = node('div', 'episode-head'); const left = node('div');
      left.append(node('h3', '', `${S.task} · ${S.tier} · 第 ${ep.idx} 局`));
      const meta = [`seed ${ep.seed}`, `评估 episode ${ep.eval_episode}`, `第 ${ep.round} 轮`];
      if (ep.candidate != null) meta.push(`候选 ${ep.candidate}`);
      if (ep.source_episode != null) meta.push(`原 episode ${ep.source_episode}`);
      left.append(node('div', 'episode-meta', meta.join(' · ')));
      const sync = node('button', 'sync', '同步播放'); sync.type = 'button'; sync.id = 'sync-play';
      sync.addEventListener('click', () => {
        const vids = [...box.querySelectorAll('video')];
        vids.forEach(v => { v.pause(); v.currentTime = 0; });
        vids.forEach(v => v.play().catch(() => {}));
      });
      head.append(left, sync); box.append(head);
      const entries = S.tier === 'xhard0' ? ['new', 'old'] : ['new'];
      entries.forEach(entry => {
        const sec = node('div', 'entry'); const label = node('div', 'entry-label', ENTRY_ZH[entry]);
        if (entry === 'old') {
          const flips = policies().filter(p => ep.flip && ep.flip[p.id]).map(p => p.label);
          if (flips.length) label.append(node('small', '', `与新入口成败不同：${flips.join('、')}${ep.rerun ? '（原因已查明，见下方「同卡重跑」）' : ''}`));
        }
        sec.append(label);
        const cols = node('div', 'cols');
        cols.append(genColumn(ep.gen[entry], S.tier));
        policies().forEach(p => cols.append(evalColumn(p, (ep.eval[entry] || {})[p.id])));
        sec.append(cols); box.append(sec);
      });
      if (ep.rerun) box.append(rerunSection(ep));
      box.append(subgoalEpisode(ep));
    }

    // ---- 逐段 subgoal 帧数（v7_subgoal_lengths.py）----
    const VERDICT_CLS = { '不一致': 'v-diff', '新增': 'v-new', '基准': 'v-base' };
    const fmtCell = c => c ? `${c.median}（${c.min}～${c.max}，${c.n} 段）` : '—';
    function sgRow(tpl, kind) {
      return ((S.sg.summary || {})[S.task] || []).find(r => r.tpl === tpl && r.kind === kind);
    }
    function renderSgPanel() {
      const p = el('sg-panel'); p.textContent = '';
      const rows = S.sg && S.sg.summary && S.sg.summary[S.task];
      if (!rows) { p.hidden = true; return; }
      p.hidden = false;
      const nd = rows.reduce((a, r) => a + Object.values(r.tiers).filter(c => c.verdict !== '一致' && c.verdict !== '基准').length, 0);
      p.append(node('summary', '', `subgoal 逐段帧数：与 xhard0 对照（${nd ? `有 ${nd} 格不一致或新增` : '各档全部一致'}）`));
      const b = node('div', 'sg-body');
      b.append(node('p', 'sg-explain', (S.sg.explain || {})[S.task] || ''));
      b.append(node('p', '', `口径：${S.sg.rule} 每格写「中位帧数（最小～最大，段数）」。xhard0 新入口与官方旧入口逐段完全相同：${S.sg.xhard0_new_old_same.join('/')} 局。`));
      const t = node('table', 'sg-table'); const h = node('tr');
      ['首次／后续', 'subgoal 模板'].concat(S.cat.tiers).forEach(x => h.append(node('th', S.cat.tiers.includes(x) && x === S.tier ? 'is-cur' : '', x)));
      t.append(h);
      rows.forEach(r => {
        const tr = node('tr'); tr.append(node('td', '', r.kind), node('td', 'txt', r.tpl));
        S.cat.tiers.forEach(tier => {
          const c = r.tiers[tier];
          const td = node('td', (c ? (VERDICT_CLS[c.verdict] || '') : '') + (tier === S.tier ? ' is-cur' : ''), fmtCell(c));
          if (c && c.verdict !== '一致') td.title = c.verdict;
          tr.append(td);
        });
        t.append(tr);
      });
      b.append(t);
      b.append(node('p', '', '红色 = 与 xhard0 中位数相差超过阈值；黄色 = xhard0 没有这种 subgoal；「—」= 该档没有这种 subgoal。'));
      p.append(b);
    }
    function subgoalEpisode(ep) {
      const wrap = node('div', 'sg-ep');
      const rec = S.sg && S.sg.episodes && ((S.sg.episodes[S.task] || {})[S.tier] || {})[String(ep.idx)];
      if (!rec) return wrap;
      const segs = rec.new || [];
      const two = S.tier === 'xhard0';
      const same = two && JSON.stringify(rec.new) === JSON.stringify(rec.old);
      wrap.append(node('div', 'entry-label', `本局逐段 subgoal 帧数（共 ${segs.length} 段，${segs.reduce((a, s) => a + s.frames, 0)} 帧）`));
      if (two) wrap.lastChild.append(node('small', '', same ? '新入口与官方旧入口逐段完全相同' : '新入口与官方旧入口逐段不同！'));
      if (!segs.length) { wrap.append(node('div', 'notes', '空 h5（官方原版即生成失败），没有 subgoal。')); return wrap; }
      const t = node('table', 'sg-table'); const h = node('tr');
      ['#', 'subgoal', '帧数', '首次／后续', 'xhard0 同类中位', '与 xhard0 比'].forEach(x => h.append(node('th', '', x)));
      t.append(h);
      segs.forEach((s, i) => {
        const r = sgRow(s.tpl, s.kind), base = r && r.tiers.xhard0, mine = r && r.tiers[S.tier];
        const tr = node('tr');
        tr.append(node('td', '', String(i + 1)), node('td', 'txt', s.text), node('td', '', String(s.frames)), node('td', '', s.kind),
          node('td', '', base ? `${base.median}（${base.min}～${base.max}）` : 'xhard0 无此类'));
        let v = S.tier === 'xhard0' ? '基准' : (mine ? mine.verdict : '—');
        if (S.tier !== 'xhard0' && base && v === '一致' && (s.frames < base.min || s.frames > base.max)) v = '一致（本段超出 xhard0 范围）';
        tr.append(node('td', VERDICT_CLS[v] || '', v));
        t.append(tr);
      });
      wrap.append(t);
      return wrap;
    }

    // ---- MME 同卡重跑（12.248）----
    const stSpan = r => { const x = node('span', 'st-' + r.status, `${STATUS_ZH[r.status]}/${r.steps} 步`); return x; };
    const same = (a, b) => a && b && a.status === b.status && a.steps === b.steps;
    function rerunFacts(ep) {
      const o0 = ep.eval.old.mmevla, n0 = ep.eval.new.mmevla, o1 = ep.rerun.mmevla.old, n1 = ep.rerun.mmevla.new;
      const facts = [];
      facts.push(['旧入口自己重跑', o0.status === o1.status ? `成败不变（${STATUS_ZH[o0.status]}）` : `${STATUS_ZH[o0.status]} → ${STATUS_ZH[o1.status]}，自己就复现不了`]);
      facts.push(['新入口自己重跑', n0.status === n1.status ? `成败不变（${STATUS_ZH[n0.status]}）` : `${STATUS_ZH[n0.status]} → ${STATUS_ZH[n1.status]}，自己就复现不了`]);
      facts.push(['同卡重跑后两入口', o1.status === n1.status ? `成败相同（都是${STATUS_ZH[o1.status]}）` : `仍然不同（旧 ${STATUS_ZH[o1.status]}、新 ${STATUS_ZH[n1.status]}）`]);
      const twins = [];
      if (same(n1, o0)) twins.push('新入口重跑 = 旧入口原来那次');
      if (same(o1, n0)) twins.push('旧入口重跑 = 新入口原来那次');
      if (same(n1, o1)) twins.push('同卡重跑两入口彼此相同');
      if (same(o1, o0) && !twins.length) twins.push('旧入口两次完全相同');
      if (same(n1, n0) && twins.length < 2 && !twins.includes('旧入口两次完全相同')) twins.push('新入口两次完全相同');
      if (twins.length) facts.push(['成败与步数逐步相同', twins.join('；')]);
      return facts;
    }
    function rerunSection(ep) {
      const sec = node('div', 'entry');
      const label = node('div', 'entry-label', '同卡重跑 · 只重跑 MME-VLA');
      label.append(node('small', '', `${S.cat.rerun11.when} · ${S.cat.rerun11.where}`));
      sec.append(label);
      const cols = node('div', 'cols');
      const card = node('div', 'col'); const h = node('div', 'col-head'); h.append(node('span', 'col-title', '这一局的四次结果')); card.append(h);
      const v = node('div', 'verdict');
      const t = node('table', 'rr-table');
      const hr = node('tr'); ['', '原评估', '同卡重跑'].forEach(x => hr.append(node('th', '', x))); t.append(hr);
      [['旧入口（官方 robomme）', ep.eval.old.mmevla, ep.rerun.mmevla.old], ['新入口（robomme_hard）', ep.eval.new.mmevla, ep.rerun.mmevla.new]].forEach(([name, a, b]) => {
        const tr = node('tr'); tr.append(node('td', '', name));
        [a, b].forEach(r => { const td = node('td'); td.append(stSpan(r)); tr.append(td); }); t.append(tr);
      });
      v.append(t);
      const ul = node('ul');
      rerunFacts(ep).forEach(([k, val]) => { const li = node('li'); li.append(node('b', '', k + '：'), document.createTextNode(val)); ul.append(li); });
      v.append(ul);
      v.append(node('div', '', '结论见上方「MME 两个入口为什么会有 11 局成败相反？」面板。'));
      card.append(v); cols.append(card);
      [['new', '新入口重跑 · MME-VLA'], ['old', '旧入口重跑 · MME-VLA']].forEach(([entry, title]) => {
        const r = ep.rerun.mmevla[entry];
        const col = node('div', 'col'); const hd = node('div', 'col-head');
        hd.append(node('span', 'col-title', title), node('span', 'badge s-' + r.status, STATUS_ZH[r.status]));
        col.append(hd, node('div', 'col-meta', `步数 ${r.steps} / 上限 ${r.max_steps}`), videoEl(r.media));
        cols.append(col);
      });
      sec.append(cols);
      return sec;
    }
    function rerunRows() {
      const rows = [];
      S.cat.tasks.forEach(t => { const c = t.tiers.xhard0; if (!c) return; c.episodes.forEach(ep => { if (ep.rerun) rows.push([t, ep]); }); });
      return rows;
    }
    function renderRerunPanel() {
      const box = el('rerun-panel');
      if (S.tier !== 'xhard0' || !S.cat.rerun11) { box.hidden = true; return; }
      box.hidden = false; box.textContent = '';
      box.append(node('summary', '', 'MME 两个入口为什么会有 11 局成败相反？——已查明：MME 策略自己的计算每次都有细微差别，入口没有问题'));
      const b = node('div', 'rerun-body');
      const P = html => { const p = node('p'); p.innerHTML = html; b.append(p); };
      P('<b>现象。</b>xhard0 的 192 局用两个入口各评了一次：旧入口（官方 <code>robomme</code>，<code>dataset="test"</code>）与新入口（<code>robomme_hard</code>，<code>dataset="test-hard"</code>）。两个入口建出的环境已证明逐字节相同（192/192）。SimpleMemVLA 两入口成败逐局相同，<b>MME-VLA 却有 11 局成败相反</b>（5 局成→败、5 局败→成、1 局超时→成，总数 50 对 51 几乎持平）。');
      P('<b>两种可能。</b>A：MME 自己不稳定——GPU／JAX 数值在不同卡、不同编译历史下有微小差异，被策略放大。B：两个入口喂给 MME 的输入有系统差别——那就是 benchmark 的 bug。');
      P('<b>怎么验证。</b>在同一张 A40 上，先用旧入口、再用新入口，把这 11 局各重跑一次（11 局 × 2 入口 = 22 局）。代码、模型、服务端种子（7）都和原评估相同。同入口重跑就变了 → A；各自稳定、两入口仍不同 → B。');
      P('<b>结果。</b>① 同一个入口自己就复现不了：旧入口 5／11 局、新入口 4／11 局与自己原来成败不同。② 同一条轨迹会在另一个入口原样出现，连步数都逐步相同（下表绿底）：例如 ButtonUnmaskSwap 新入口重跑「成功/458 步」＝旧入口原来那次；VideoPlaceButton 新入口重跑「失败/178」＝旧入口两次。能跑出完全相同的轨迹，说明两个入口给策略的输入没有区别。③ 同一张卡上两入口仍有 6 局不同，说明不稳定不只来自换节点。');
      P('<b>结论：A 成立，B 不成立。</b>benchmark 的新入口没有 bug；MME 在这些局上的成败接近随机，单次成功率本身带几个百分点的波动。MoveCube、SwingXtimes、VideoUnmaskSwap 552300 两次都是「两入口不同」，但每入口只有 2 个样本，不足以单独判为 B。');
      P(`判定行：<code>${S.cat.rerun11.parity}</code>（留档 <code>docs/validation/newtask-v7/README.md</code> ⑥，提交 ${S.cat.rerun11.commit}）`);
      const t = node('table', 'rr-table');
      const hr = node('tr'); ['任务', '局', 'seed', '旧入口 原评估', '旧入口 重跑', '新入口 原评估', '新入口 重跑'].forEach(x => hr.append(node('th', '', x))); t.append(hr);
      rerunRows().forEach(([task, ep]) => {
        const tr = node('tr'); if (task.id === S.task && ep.idx === S.ep) tr.className = 'is-here';
        const a = node('a', '', `${task.id}`); a.addEventListener('click', () => select(task.id, 'xhard0', ep.idx));
        const td0 = node('td'); td0.append(a); tr.append(td0, node('td', '', `第 ${ep.idx} 局`), node('td', '', String(ep.seed)));
        const cells = [ep.eval.old.mmevla, ep.rerun.mmevla.old, ep.eval.new.mmevla, ep.rerun.mmevla.new];
        cells.forEach((r, i) => {
          const td = node('td'); const sp = stSpan(r);
          if (cells.some((q, j) => j !== i && same(q, r))) sp.classList.add('rr-same');
          td.append(sp); tr.append(td);
        });
        t.append(tr);
      });
      b.append(t);
      b.append(node('p', '', '绿底 = 这一格与同一行另一格的成败和步数完全相同（同一条轨迹）。点任务名跳到该局，下方「同卡重跑」一节可以直接看四段录像中的两段重跑。'));
      box.append(b);
    }

    function renderNotes() {
      const n = el('notes'); n.textContent = '';
      Object.values(S.cat.notes || {}).forEach(t => n.append(node('p', '', t)));
    }

    function select(task, tier, ep) {
      S.task = task;
      const t = taskObj();
      S.tier = tier && t.tiers[tier] ? tier : (t.tiers[S.tier] ? S.tier : Object.keys(t.tiers)[0]);
      const eps = cell().episodes;
      S.ep = ep && eps.some(e => e.idx === ep) ? ep : eps[0].idx;
      if (S.filter === 'flip' && S.tier !== 'xhard0') S.filter = 'all';
      writeHash();
      el('task-title').textContent = `${t.name} · ${t.id}`;
      const counts = Object.entries(t.tiers).map(([k, v]) => `${k} ${v.episodes.length} 局`).join(' · ');
      el('task-sub').textContent = counts;
      renderNav(); renderMatrix(); renderTabs(); renderFilters(); renderSgPanel(); renderRerunPanel(); renderChips(); renderEpisode();
    }

    async function load() {
      try {
        const res = await fetch('/api/catalog', { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status);
        S.cat = await res.json();
        try { const r2 = await fetch('/api/subgoals', { cache: 'no-store' }); S.sg = r2.ok ? await r2.json() : null; } catch (e) { S.sg = null; }
        el('status-panel').hidden = true; el('task-section').hidden = false;
        renderNotes();
        const h = readHash();
        const task = S.cat.tasks.some(t => t.id === h.task) ? h.task : S.cat.tasks[0].id;
        select(task, h.tier, h.ep);
      } catch (err) {
        el('status-panel').textContent = '目录载入失败：' + err.message;
      }
    }
    el('task-search').addEventListener('input', renderNav);
    el('menu-toggle').addEventListener('click', () => el('sidebar').classList.toggle('is-open'));
    window.addEventListener('hashchange', () => { if (!S.cat) return; const h = readHash(); if (h.task && (h.task !== S.task || h.tier !== S.tier || h.ep !== S.ep)) select(h.task, h.tier, h.ep); });
    load();
  </script>
</body>
</html>
